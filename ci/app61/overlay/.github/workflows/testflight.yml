name: TestFlight Upload

on:
  push:
    branches:
      - internal-testing
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: kira-testflight-upload
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Signed iOS archive and TestFlight upload
    if: >-
      ${{ github.ref == 'refs/heads/internal-testing' &&
          !contains(github.event.head_commit.message || '', '[skip ios]') &&
          !contains(github.event.head_commit.message || '', '[skip both]') }}
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      KIRA_SOURCE_ENTITLEMENTS: ${{ github.workspace }}/iosApp/iosApp/iosApp.entitlements
      KIRA_PACKAGES_USER: ${{ github.actor }}
      KIRA_SOURCE_CONFIG_BASE_URL: ${{ vars.KIRA_SOURCE_CONFIG_BASE_URL }}
      KIRA_SOURCE_CONFIG_PINNED_KEYS: ${{ vars.KIRA_SOURCE_CONFIG_PINNED_KEYS }}
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_DISABLE_COLORS: "1"
      CI: "true"

    steps:
      - name: Check out internal-testing
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify pinned bootstrap inputs
        run: /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb

      - name: Verify the selected Xcode identity
        run: |
          [[ "$(/usr/bin/xcodebuild -version)" == $'Xcode 26.4.1\nBuild version 17E202' ]] || {
            echo 'Selected Xcode version/build does not match the reviewed runtime' >&2
            exit 1
          }

      - name: Initialize protected temporary paths
        run: |
          set +x
          umask 077
          {
            printf 'KIRA_SECRET_DIR=%s\n' "$RUNNER_TEMP/kira-protected"
            printf 'KIRA_PROFILE_PLIST=%s\n' "$RUNNER_TEMP/kira-profile.plist"
            printf 'KIRA_PROFILE_UUID_FILE=%s\n' "$RUNNER_TEMP/kira-profile-uuid"
            printf 'KIRA_APPLICATION_IDENTIFIER_FILE=%s\n' "$RUNNER_TEMP/kira-application-identifier"
            printf 'KIRA_FIREBASE_PLIST=%s\n' "$RUNNER_TEMP/kira-protected/GoogleService-Info.plist"
            printf 'KIRA_CERTIFICATE_PEM=%s\n' "$RUNNER_TEMP/kira-distribution-certificate.pem"
            printf 'KIRA_PRIVATE_KEY_PEM=%s\n' "$RUNNER_TEMP/kira-distribution-private-key.pem"
            printf 'KIRA_KEYCHAIN_PATH=%s\n' "$RUNNER_TEMP/kira-signing.keychain-db"
            printf 'KIRA_XCCONFIG_PATH=%s\n' "$RUNNER_TEMP/kira-release.xcconfig"
            printf 'KIRA_EXPORT_OPTIONS_PATH=%s\n' "$RUNNER_TEMP/ExportOptions.plist"
            printf 'KIRA_BUILD_NUMBER_FILE=%s\n' "$RUNNER_TEMP/kira-build-number"
            printf 'KIRA_ARCHIVE_PATH=%s\n' "$RUNNER_TEMP/Kira.xcarchive"
            printf 'KIRA_EXPORT_PATH=%s\n' "$RUNNER_TEMP/KiraExport"
            printf 'KIRA_IPA_PATH_FILE=%s\n' "$RUNNER_TEMP/kira-ipa-path"
            printf 'KIRA_ARTIFACT_STATUS_FILE=%s\n' "$RUNNER_TEMP/kira-artifact-status.json"
            printf 'KIRA_TESTFLIGHT_STATUS_FILE=%s\n' "$RUNNER_TEMP/kira-testflight-status.json"
            printf 'CRASHLYTICS_DSYM_UPLOAD_MARKER=%s\n' "$RUNNER_TEMP/crashlytics-dsym-uploaded"
            printf 'APP_STORE_CONNECT_KEY_PATH=%s\n' "$RUNNER_TEMP/kira-protected/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21.0.12+101.0.LTS"
          check-latest: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Ruby and pinned Fastlane
        uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1
        with:
          ruby-version: "3.3.12"
          bundler: "4.0.16"
          bundler-cache: true

      - name: Install verified XcodeGen
        run: bash scripts/release/install-xcodegen.sh

      # App63's generated target copies Firebase only in its Release build phase;
      # generation and package resolution need no Firebase file or signing assets.
      - name: Generate the Xcode project
        working-directory: iosApp
        run: '"$KIRA_XCODEGEN" generate'

      - name: Remove temporary XcodeGen
        if: ${{ always() }}
        run: bash scripts/release/cleanup-xcodegen.sh

      - name: Resolve the reviewed SwiftPM lock before protected inputs
        run: |
          set -euo pipefail
          /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb --restore-swiftpm
          xcodebuild -resolvePackageDependencies \
            -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/DerivedData/SourcePackages" \
            -packageCachePath "$RUNNER_TEMP/kira-swiftpm-cache" \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb --check-swiftpm

      - name: Consume the verified Apple Gradle graph before protected inputs
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 :composeApp:linkReleaseFrameworkIosArm64 --dependency-verification=strict --no-configuration-cache --no-build-cache --no-daemon -PkiraUseMavenLocal=false -Porg.gradle.java.installations.auto-download=false -Pandroid.builder.sdkDownload=false --stacktrace

      - name: Verify protected value names are present
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TESTFLIGHT_FEEDBACK_EMAIL: ${{ secrets.TESTFLIGHT_FEEDBACK_EMAIL }}
          BETA_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.BETA_REVIEW_CONTACT_FIRST_NAME }}
          BETA_REVIEW_CONTACT_LAST_NAME: ${{ secrets.BETA_REVIEW_CONTACT_LAST_NAME }}
          BETA_REVIEW_CONTACT_EMAIL: ${{ secrets.BETA_REVIEW_CONTACT_EMAIL }}
          BETA_REVIEW_CONTACT_PHONE: ${{ secrets.BETA_REVIEW_CONTACT_PHONE }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set +x
          ruby release/ios/validate_testflight_metadata.rb

      - name: Verify the HTTPS source-config authority is live and signed
        run: |
          set +x
          base_url="${KIRA_SOURCE_CONFIG_BASE_URL%/}"
          headers="$RUNNER_TEMP/kira-source-document.headers"
          body="$RUNNER_TEMP/kira-source-document.json"
          if [[ -z "$base_url" || -z "$KIRA_SOURCE_CONFIG_PINNED_KEYS" ]]; then
            echo "Source-config release variables are missing" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --location --max-time 30 \
            --proto '=https' --tlsv1.2 \
            -D "$headers" -o "$body" \
            "$base_url/api/v1/source-config/document"

          for header in \
            x-config-signature-format x-config-signature-algorithm \
            x-config-signing-key-id x-config-signature \
            x-config-revision x-config-checksum x-config-created-at; do
            if ! grep -Eiq "^${header}:[[:space:]]*[^[:space:]].*$" "$headers"; then
              echo "Source-config response is missing signed header: $header" >&2
              exit 1
            fi
          done

          key_id="$(awk -F': *' 'tolower($1) == "x-config-signing-key-id" { print $2 }' "$headers" | tr -d '\r')"
          if ! printf '%s\n' "$KIRA_SOURCE_CONFIG_PINNED_KEYS" | tr ',' '\n' |
            awk -F= -v expected="$key_id" '$1 == expected { found = 1 } END { exit(found ? 0 : 1) }'; then
            echo "Live source-config signing key id is not pinned by the iOS release" >&2
            exit 1
          fi
          echo "Verified HTTPS source-config endpoint and pinned signing key id: $key_id"

      - name: Decode protected files without logging contents
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set +x
          umask 077
          ruby release/ios/prepare_secret_files.rb

      - name: Validate committed release configuration
        run: ruby release/ios/validate_project_configuration.rb

      - name: Validate and install signing assets
        env:
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set +x
          umask 077
          security cms -D -i "$KIRA_SECRET_DIR/distribution.mobileprovision" -o "$KIRA_PROFILE_PLIST" >/dev/null 2>&1 || { echo "Provisioning profile could not be decoded" >&2; exit 1; }
          # The supplied Apple PKCS#12 uses an algorithm supported by macOS's
          # system crypto provider but rejected by Ruby 3.3's OpenSSL 3 build.
          # Keep the password file-based and use the system provider only for
          # this extraction step so the password never appears in argv.
          /usr/bin/ruby release/ios/extract_signing_identity.rb
          ruby release/ios/validate_signing_assets.rb

          security create-keychain -p "" "$KIRA_KEYCHAIN_PATH" >/dev/null
          security set-keychain-settings -lut 21600 "$KIRA_KEYCHAIN_PATH" >/dev/null
          security unlock-keychain -p "" "$KIRA_KEYCHAIN_PATH" >/dev/null
          swift release/ios/import_signing_identity.swift \
            "$KIRA_SECRET_DIR/distribution.p12" \
            "$KIRA_SECRET_DIR/distribution-password" \
            "$KIRA_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KIRA_KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KIRA_KEYCHAIN_PATH"

          profile_uuid="$(tr -d '\r\n' < "$KIRA_PROFILE_UUID_FILE")"
          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_directory"
          cp "$KIRA_SECRET_DIR/distribution.mobileprovision" "$profile_directory/$profile_uuid.mobileprovision"
          printf '%s\n' "$profile_directory/$profile_uuid.mobileprovision" > "$RUNNER_TEMP/kira-installed-profile-path"
          cp "$KIRA_SECRET_DIR/GoogleService-Info.plist" iosApp/iosApp/GoogleService-Info.plist

          ruby -rfileutils -e 'ARGV.each { |path| FileUtils.rm_f(path) }' \
            "$KIRA_SECRET_DIR/distribution.p12" \
            "$KIRA_SECRET_DIR/distribution-password" \
            "$KIRA_CERTIFICATE_PEM" \
            "$KIRA_PRIVATE_KEY_PEM"

      - name: Verify App Store Connect and select the next build number
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set +x
          bundle exec fastlane ios prepare_testflight
          build_number="$(tr -d '\r\n' < "$KIRA_BUILD_NUMBER_FILE")"
          if ! [[ "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "App Store Connect returned an invalid build number" >&2
            exit 1
          fi
          printf 'KIRA_BUILD_NUMBER=%s\n' "$build_number" >> "$GITHUB_ENV"

      - name: Generate protected Xcode release settings
        run: |
          set +x
          ruby release/ios/write_release_configuration.rb
          plutil -lint "$KIRA_EXPORT_OPTIONS_PATH"

      - name: Archive the signed App Store build
        id: archive
        env:
          CRASHLYTICS_DSYM_UPLOAD_DEFERRED: "1"
        run: |
          set +x
          /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb --check-swiftpm
          log="$RUNNER_TEMP/xcode-archive.log"
          if ! xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release -destination 'generic/platform=iOS' -archivePath "$KIRA_ARCHIVE_PATH" -derivedDataPath "$RUNNER_TEMP/DerivedData" -clonedSourcePackagesDirPath "$RUNNER_TEMP/DerivedData/SourcePackages" -packageCachePath "$RUNNER_TEMP/kira-swiftpm-cache" -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution -skipPackageUpdates -xcconfig "$KIRA_XCCONFIG_PATH" -quiet archive >"$log" 2>&1; then
            ruby release/ios/safe_xcode_log.rb "$log"
            exit 1
          fi
          /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb --check-swiftpm
          echo "Signed App Store archive created; Crashlytics upload is the next mandatory gate"

      - name: Upload and confirm the archived app dSYM in Crashlytics
        id: crashlytics-dsym
        run: |
          set +x
          upload_tool="$RUNNER_TEMP/DerivedData/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
          app_dsym="$KIRA_ARCHIVE_PATH/dSYMs/Kira.app.dSYM"
          ruby release/ios/upload_crashlytics_dsyms.rb \
            "$upload_tool" "$KIRA_FIREBASE_PLIST" "$app_dsym"
          if [ ! -f "$CRASHLYTICS_DSYM_UPLOAD_MARKER" ]; then
            echo "Crashlytics dSYM upload was not confirmed" >&2
            exit 1
          fi
          echo "Archived app dSYM upload confirmed"

      - name: Export the signed IPA
        id: export
        run: |
          set +x
          log="$RUNNER_TEMP/xcode-export.log"
          if ! xcodebuild -exportArchive -archivePath "$KIRA_ARCHIVE_PATH" -exportPath "$KIRA_EXPORT_PATH" -exportOptionsPlist "$KIRA_EXPORT_OPTIONS_PATH" -quiet >"$log" 2>&1; then
            ruby release/ios/safe_xcode_log.rb "$log"
            exit 1
          fi
          ipa_path="$(find "$KIRA_EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "Xcode export succeeded without producing an IPA" >&2
            exit 1
          fi
          printf '%s\n' "$ipa_path" > "$KIRA_IPA_PATH_FILE"
          printf 'KIRA_IPA_PATH=%s\n' "$ipa_path" >> "$GITHUB_ENV"
          echo "Signed IPA exported"

      - name: Validate the signed archive, IPA, entitlements, and dSYM UUIDs
        id: artifact-validation
        run: ruby release/ios/validate_artifacts.rb

      - name: Upload to TestFlight without external distribution or review submission
        id: testflight-upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TESTFLIGHT_FEEDBACK_EMAIL: ${{ secrets.TESTFLIGHT_FEEDBACK_EMAIL }}
          BETA_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.BETA_REVIEW_CONTACT_FIRST_NAME }}
          BETA_REVIEW_CONTACT_LAST_NAME: ${{ secrets.BETA_REVIEW_CONTACT_LAST_NAME }}
          BETA_REVIEW_CONTACT_EMAIL: ${{ secrets.BETA_REVIEW_CONTACT_EMAIL }}
          BETA_REVIEW_CONTACT_PHONE: ${{ secrets.BETA_REVIEW_CONTACT_PHONE }}
        run: |
          set +x
          bundle exec fastlane ios upload_only

      - name: Query final App Store Connect state
        if: ${{ always() && steps.artifact-validation.outcome == 'success' }}
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set +x
          bundle exec fastlane ios record_testflight_status

      - name: Preserve signed release artifacts and non-sensitive validation reports
        if: ${{ always() && steps.artifact-validation.outcome == 'success' }}
        run: |
          set +x
          ditto -c -k --sequesterRsrc --keepParent "$KIRA_ARCHIVE_PATH" "$RUNNER_TEMP/Kira.xcarchive.zip"
          mkdir -p "$RUNNER_TEMP/kira-release-report"
          cp "$KIRA_ARTIFACT_STATUS_FILE" "$RUNNER_TEMP/kira-release-report/"
          if [ -f "$KIRA_TESTFLIGHT_STATUS_FILE" ]; then
            cp "$KIRA_TESTFLIGHT_STATUS_FILE" "$RUNNER_TEMP/kira-release-report/"
          fi

      - name: Upload signed IPA, archive, and dSYMs
        if: ${{ always() && steps.artifact-validation.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kira-ios-1.0.5-${{ env.KIRA_BUILD_NUMBER }}
          path: |
            ${{ env.KIRA_IPA_PATH }}
            ${{ runner.temp }}/Kira.xcarchive.zip
            ${{ env.KIRA_ARCHIVE_PATH }}/dSYMs
            ${{ runner.temp }}/kira-release-report
          retention-days: 30
          if-no-files-found: error

      - name: Write non-sensitive release summary
        if: ${{ always() }}
        run: ruby release/ios/write_workflow_summary.rb

      - name: Remove temporary credentials and signing keychain
        if: ${{ always() }}
        run: |
          set +x
          security delete-keychain "$KIRA_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          ruby -rfileutils -e '
            paths = [
              ENV["KIRA_SECRET_DIR"], ENV["KIRA_PROFILE_PLIST"], ENV["KIRA_CERTIFICATE_PEM"],
              ENV["KIRA_PRIVATE_KEY_PEM"], ENV["KIRA_XCCONFIG_PATH"], ENV["KIRA_EXPORT_OPTIONS_PATH"],
              File.join(ENV.fetch("GITHUB_WORKSPACE"), "iosApp/iosApp/GoogleService-Info.plist")
            ]
            installed_path_file = File.join(ENV.fetch("RUNNER_TEMP"), "kira-installed-profile-path")
            if File.file?(installed_path_file)
              paths << File.read(installed_path_file).strip
              paths << installed_path_file
            end
            paths.compact.each { |path| FileUtils.rm_rf(path) }
          '

name: CI

# Post-audit safety net. Mirrors the compile matrix + test/assemble gates verified green locally
# (composeApp Android/Desktop/iOS Arm64/iOS Sim + :desktopApp JVM + :app debug), the full module
# test suite (11 desktopTest suites + :app Koin DI-graph registration test + both locale-parity
# gates), and a debug APK assembly. Kept in lockstep with the local gate cadence (last synced
# 2026-07-04, audit Wave C).
#
# A clean GitHub runner does an online dependency resolve, which may surface the clean-checkout
# resolution issue the state audit flagged (the local builds pass only via a warm Gradle cache).
# That signal is intentional — fix repository availability if a run is red on resolution.
#
# Static analysis (detekt + ktlint) runs as a CI-only `static-analysis` job below, via the tools'
# standalone CLI release jars — deliberately NOT Gradle plugins, so the local offline build graph is
# untouched (adding an uncached plugin would break `./gradlew --offline`). The job is BLOCKING
# since T3 (2026-07-03). The release-readiness snapshot was refreshed on 2026-08-04
# (config/ktlint-baseline.xml — 7,807 findings; config/detekt-baseline.xml — 2,250 weighted issues)
# with the exact CLI invocations below and mutation-verified to fail on NEW findings, so the gate
# trips only on violations introduced after that snapshot. Shrink the baselines opportunistically;
# refresh them only through an explicit, reviewed snapshot commit. detekt 1.23.7's bundled parser
# handles the project's Kotlin 2.4 sources (verified 2026-07-03). The read-only native-app/ parity
# spec is excluded — not our code to lint.
#
# Reproduce locally (tools + checksums as below, from the repo root):
#   ktlint --baseline=config/ktlint-baseline.xml --relative "**/src/**/*.kt" "!**/build/**" \
#     "!**/sources_repositry/**" "!native-app/**" "!.parity_i18n_tmp/**"
#   detekt-cli --input . --excludes "**/build/**,**/sources_repositry/**,**/native-app/**,**/.parity_i18n_tmp/**" \
#     --build-upon-default-config --baseline config/detekt-baseline.xml
# Cache the two CLIs locally instead of re-downloading per run — this project's dev machine keeps
# them in ~/.kira/tools/ (`ktlint` self-exec jar + `detekt-cli-1.23.7/bin/detekt-cli`, the same
# pinned versions + checksums as the steps below). Formatting gotcha: ktlint --format on a
# baselined file resurfaces that file's OLD findings as "new" (ktlint baselines match on
# line/column; detekt signatures embed the parameter-list text, which the ktlint_official style
# rewrites) — fix the surfaced findings for real; don't re-baseline them.

on:
  # Actions policy (owner rule): CI must NEVER run on `main` — the owner pushes to main frequently
  # and every-push runs burn Actions minutes for no value. CI runs ONLY on pushes to the `testing`
  # and `release` branches, plus manual dispatch. Deliberately no `pull_request` and no tag
  # triggers: a PR into main or a tag push must not start a run either.
  push:
    branches: [ testing, release ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Android CI build number. The dedicated TestFlight workflow queries App Store Connect instead.
  KIRA_BUILD_NUMBER: ${{ github.run_number }}
  KIRA_PACKAGES_USER: ${{ github.actor }}
  KIRA_SOURCE_CONFIG_BASE_URL: ${{ vars.KIRA_SOURCE_CONFIG_BASE_URL }}
  KIRA_SOURCE_CONFIG_PINNED_KEYS: ${{ vars.KIRA_SOURCE_CONFIG_PINNED_KEYS }}

jobs:
  jvm-android:
    name: JVM/Android compile + :domain tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify pinned bootstrap inputs
        run: /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
          check-latest: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compile (Android + Desktop + :desktopApp JVM)
        # compileAndroidMain: the AGP-9 new-DSL KMP-library plugin's single-variant Android compile
        # task — the old per-variant compileDebugKotlinAndroid no longer exists post-migration.
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: ./gradlew :composeApp:compileAndroidMain :composeApp:compileKotlinDesktop :desktopApp:compileKotlinJvm --stacktrace --dependency-verification=strict --no-configuration-cache --no-build-cache --no-daemon -PkiraUseMavenLocal=false -Porg.gradle.java.installations.auto-download=false -Pandroid.builder.sdkDownload=false
      - name: Unit tests (all 12 desktopTest suites)
        # :data:download — the iOS background-download rule suite (recovery/finalize/retry/
        # resolve-ahead/manifest-store); :platform — CBZ path-rederivation etc.; :composeApp —
        # the pilot-source parity tests + push parser/router tests + the bundled-config
        # validation/completeness release gates (ConfigBackedSourceCompletenessTest).
        # :ui — headless compose-ui-test suite (canned-state *ScreenContent renders + the L4
        # spinner pixel-visibility checks); Skiko renders software-headless, no display needed.
        # :data:local (Room migration/DAO tests), :sources:engine (the golden-fixture guard every
        # source conversion relies on) and :sources:config (config lifecycle/merger) were missing
        # from this list until the 2026-07 audit — a regression there passed CI green.
        # :sources:legacy — the dead-source cover-blanking regression guard
        # (LibraryRepositoryCoverGuardTest, 2026-07 source-lifecycle hardening).
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: ./gradlew :core:desktopTest :domain:desktopTest :data:desktopTest :data:local:desktopTest :data:download:desktopTest :platform:desktopTest :presentation:desktopTest :composeApp:desktopTest :ui:desktopTest :sources:engine:desktopTest :sources:config:desktopTest :sources:legacy:desktopTest --stacktrace --dependency-verification=strict --no-configuration-cache --no-build-cache --no-daemon -PkiraUseMavenLocal=false -Porg.gradle.java.installations.auto-download=false -Pandroid.builder.sdkDownload=false
      - name: i18n locale-key parity gates (:ui + :composeApp resource sets)
        # :composeApp has its own composeResources tree (route-adapter strings) with its own
        # parity task — both must gate (2026-07 audit: only :ui's ran in CI).
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: |
          python3 -B scripts/check_current_branding.py
          ./gradlew :ui:checkLocaleKeyParity :composeApp:checkLocaleKeyParity --stacktrace --dependency-verification=strict --no-configuration-cache --no-build-cache --no-daemon -PkiraUseMavenLocal=false -Porg.gradle.java.installations.auto-download=false -Pandroid.builder.sdkDownload=false
      - name: Validate release workflow safety contracts
        run: |
          ruby scripts/release/tests/toolchain-inputs-test.rb
          ruby scripts/release/tests/ios-upload-only-workflow-test.rb
          ruby scripts/release/tests/google-play-open-testing-test.rb
      # Ordinary Debug selects app/src/debug/google-services.json, never the BYO Store client.
      - name: Compile :app + Koin DI-graph registration test
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:testReleaseBundleIdentity --stacktrace --dependency-verification=strict --no-configuration-cache --no-build-cache --no-daemon -PkiraUseMavenLocal=false -Porg.gradle.java.installations.auto-download=false -Pandroid.builder.sdkDownload=false
      - name: Assemble debug APK (packaging + dex + manifest/resource merge)
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: ./gradlew :app:assembleDebug --stacktrace --dependency-verification=strict --no-configuration-cache --no-build-cache --no-daemon -PkiraUseMavenLocal=false -Porg.gradle.java.installations.auto-download=false -Pandroid.builder.sdkDownload=false
      - name: Upload isolated Debug APK (not a Play testing build)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    name: iOS compile + Release framework
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify pinned bootstrap inputs
        run: /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb

      - name: Verify the selected Xcode identity
        run: |
          [[ "$(/usr/bin/xcodebuild -version)" == $'Xcode 26.4.1\nBuild version 17E202' ]] || {
            echo 'Selected Xcode version/build does not match the reviewed runtime' >&2
            exit 1
          }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
          check-latest: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Compile iOS (Arm64 + SimulatorArm64)
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 --stacktrace --dependency-verification=strict --no-configuration-cache --no-build-cache --no-daemon -PkiraUseMavenLocal=false -Porg.gradle.java.installations.auto-download=false -Pandroid.builder.sdkDownload=false
      - name: Link arm64 device Release framework
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --stacktrace --dependency-verification=strict --no-configuration-cache --no-build-cache --no-daemon -PkiraUseMavenLocal=false -Porg.gradle.java.installations.auto-download=false -Pandroid.builder.sdkDownload=false

  release-verify:
    name: Android lint + R8 + AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: ${{ github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify pinned bootstrap inputs
        run: /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
          check-latest: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # Only the read-only package token is available here, never signing/store inputs.
      - name: Consume the verified Android graph before protected inputs
        env:
          KIRA_PACKAGES_READ_TOKEN: ${{ secrets.KIRA_PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ ! -e app/google-services.json && ! -L app/google-services.json ]] || {
            echo 'Unsigned preflight requires an absent Firebase slot' >&2
            exit 1
          }
          cleanup_placeholder() {
            local original_status=$?
            if [[ ! -f app/google-services.json || -L app/google-services.json ]] ||
                ! cmp -s app/google-services.json.example app/google-services.json; then
              echo 'Unsigned preflight Firebase slot changed; refusing cleanup' >&2
              exit 1
            fi
            rm -- app/google-services.json || exit 1
            exit "$original_status"
          }
          ( set -o noclobber; cat app/google-services.json.example > app/google-services.json )
          trap cleanup_placeholder EXIT
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --dependency-verification=strict --no-configuration-cache --no-build-cache --no-daemon -PkiraUseMavenLocal=false -Porg.gradle.java.installations.auto-download=false -Pandroid.builder.sdkDownload=false -PallowPlaceholderGoogleServices=true --stacktrace

      - name: Verify advertising identifiers stay disabled
        run: |
          manifest="app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
          if grep -E 'com\.google\.android\.gms\.permission\.AD_ID|android\.permission\.ACCESS_ADSERVICES_(AD_ID|ATTRIBUTION)|com\.google\.android\.gms\.ads\.APPLICATION_ID' "$manifest"; then
            echo "::error::An advertising permission or SDK declaration re-entered the release manifest."
            exit 1
          fi
          if ! grep -A2 'android:name="google_analytics_adid_collection_enabled"' "$manifest" | grep -q 'android:value="false"'; then
            echo "::error::Firebase Analytics advertising-ID collection is not explicitly disabled."
            exit 1
          fi
          if ! grep -A2 'android:name="google_analytics_default_allow_ad_personalization_signals"' "$manifest" | grep -q 'android:value="false"'; then
            echo "::error::Firebase Analytics ad personalization is not disabled by default."
            exit 1
          fi
      - name: Preserve unsigned validation bundle
        run: cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/kira-release-unsigned.aab"
      - name: Upload unsigned validation outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-validation-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/kira-release-unsigned.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.html
          retention-days: 14
      - name: Determine whether the protected Android release path is available
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set +x
          ruby -e '
            names = %w[
              KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD SIGNING_KEY_ALIAS
              SIGNING_KEY_PASSWORD GOOGLE_SERVICES_JSON
            ]
            available = names.all? { |name| !ENV[name].to_s.empty? }
            File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
              file.puts("KIRA_ANDROID_SIGNED_RELEASE_AVAILABLE=#{available}")
            end
            puts available ? "Protected Android release path is configured" : "Protected Android release path is not fully configured"
          '
      - name: Provision real Firebase config for signed bundle
        id: android-firebase
        if: ${{ env.KIRA_ANDROID_SIGNED_RELEASE_AVAILABLE == 'true' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set +x
          umask 077
          ruby -rbase64 -e '
            encoded = ENV.fetch("GOOGLE_SERVICES_JSON").gsub(/\s+/, "")
            decoded = Base64.strict_decode64(encoded)
            abort("Android Firebase secret decoded to an empty file") if decoded.empty?
            path = File.join(ENV.fetch("GITHUB_WORKSPACE"), "app/google-services.json")
            File.binwrite(path, decoded)
            File.chmod(0o600, path)
          '
      - name: Decode release keystore
        if: ${{ env.KIRA_ANDROID_SIGNED_RELEASE_AVAILABLE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +x
          umask 077
          ruby -rbase64 -e '
            encoded = ENV.fetch("KEYSTORE_BASE64").gsub(/\s+/, "")
            decoded = Base64.strict_decode64(encoded)
            abort("Android keystore secret decoded to an empty file") if decoded.empty?
            path = File.join(ENV.fetch("GITHUB_WORKSPACE"), "release.keystore")
            File.binwrite(path, decoded)
            File.chmod(0o600, path)
          '
      - name: Build and verify signed production-shaped AAB
        if: ${{ env.KIRA_ANDROID_SIGNED_RELEASE_AVAILABLE == 'true' }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --dependency-verification=strict --no-configuration-cache --no-build-cache --no-daemon -PkiraUseMavenLocal=false -Porg.gradle.java.installations.auto-download=false -Pandroid.builder.sdkDownload=false --offline --rerun-tasks --stacktrace
          jarsigner -verify -strict -certs app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed AAB
        if: ${{ env.KIRA_ANDROID_SIGNED_RELEASE_AVAILABLE == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signed-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Report unavailable signed path
        if: ${{ env.KIRA_ANDROID_SIGNED_RELEASE_AVAILABLE != 'true' }}
        run: echo "::warning::Complete Android signing and real Firebase secrets are not configured; unsigned release validation succeeded, but no signed AAB was produced."
      - name: Remove decoded Android credentials
        if: ${{ always() && (steps.android-firebase.outcome == 'success' || steps.android-firebase.outcome == 'failure') }}
        run: |
          set +x
          ruby -rfileutils -e '
            FileUtils.rm_f(File.join(ENV.fetch("GITHUB_WORKSPACE"), "release.keystore"))
            FileUtils.rm_f(File.join(ENV.fetch("GITHUB_WORKSPACE"), "app/google-services.json"))
          '

  static-analysis:
    name: Static analysis (ktlint + detekt) — blocking, baselined
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify pinned bootstrap inputs
        run: /usr/bin/ruby scripts/release/verify-toolchain-inputs.rb
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
          check-latest: false
      # ktlint: standalone CLI, no Gradle plugin. BLOCKING against config/ktlint-baseline.xml
      # (release-readiness snapshot refreshed 2026-08-04): only NEW violations fail the job. The
      # read-only native-app/ parity spec and the legacy source-repository subtree are excluded.
      - name: ktlint (blocking, baselined)
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          echo "a16be01dcc480aab2f55f444b620142152f66e31564b3b9376506d624c28a2ad  ktlint" | sha256sum -c -
          chmod +x ktlint
          ./ktlint --baseline=config/ktlint-baseline.xml --relative "**/src/**/*.kt" "!**/build/**" "!**/sources_repositry/**" "!native-app/**" "!.parity_i18n_tmp/**"
      # detekt: standalone CLI (bundles its own Kotlin compiler — 1.23.7 parses the project's
      # Kotlin 2.4 sources, verified 2026-07-03). BLOCKING against config/detekt-baseline.xml:
      # pre-existing findings are baselined; only NEW issues fail the job.
      - name: detekt (blocking, baselined)
        run: |
          curl -sSLO https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7.zip
          echo "a641ecd392251336f8a1b7e1192acb603e47e04cbbb994aa3541c5fa9fc0bc87  detekt-cli-1.23.7.zip" | sha256sum -c -
          unzip -q detekt-cli-1.23.7.zip
          ./detekt-cli-1.23.7/bin/detekt-cli --input . --excludes "**/build/**,**/sources_repositry/**,**/native-app/**,**/.parity_i18n_tmp/**" --build-upon-default-config --baseline config/detekt-baseline.xml

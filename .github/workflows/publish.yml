name: Held publisher intake (Maven publication disabled)

# Remote package publication is disabled by Engine6 current-source containment.
# No package-write permission, write credential, Gradle execution or approval bypass.
# The control caller is initially UNCONFIGURED and cannot select/create an environment.

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Exact producer tuple, source_branch_tip, tag_object and two parity references (no policy or credentials)
        required: true
        type: string
      access_check:
        description: Read-only native approval and built-in package-read check; cannot publish
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: engine-held-publisher-intake
  cancel-in-progress: false # This is NOT exclusion of other or out-of-band writers.

jobs:
  approval-and-access-check:
    if: >-
      ${{ inputs.access_check && github.event_name == 'workflow_dispatch' &&
          github.repository == 'kira-manga/kira-source-engine' && github.repository_id == '1310736214' &&
          github.ref == 'refs/heads/remediation/production-readiness-2026-09-04' && github.run_attempt == 1 &&
          github.workflow_ref == format('kira-manga/kira-source-engine/.github/workflows/publish.yml@{0}', github.ref) &&
          github.workflow_sha == github.sha }}
    # Fixed, owner-authorized environment. This job has no publisher outputs or write authority.
    environment: source-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      packages: read
    steps:
      - name: Observe existing built-in package access after genuine native approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          python3 -B - <<'PY'
          import base64, hashlib, json, os, re, ssl, urllib.error, urllib.parse, urllib.request
          token, actor = os.environ.pop('GH_TOKEN'), os.environ.pop('GH_ACTOR')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect(),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          basic = base64.b64encode((actor + ':' + token).encode()).decode()
          requests = (
              ('package_inventory', 'https://api.github.com/orgs/kira-manga/packages?package_type=maven&per_page=100', 'Bearer ' + token),
              ('published_0_1_pom', 'https://maven.pkg.github.com/kira-manga/kira-source-engine/me/manga/kira/source/source-engine/0.1.0/source-engine-0.1.0.pom', 'Basic ' + basic),
          )
          for name, url, auth in requests:
              result = {'check': name, 'read_only': True}
              try:
                  req = urllib.request.Request(url, headers={'Authorization': auth,
                      'User-Agent': 'Kira-publication-access-check', 'X-GitHub-Api-Version': '2022-11-28'})
                  try:
                      response = opener.open(req, timeout=10)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      body = response.read(1048577)
                      result.update(status=response.status, within_bound=len(body) <= 1048576,
                          complete_page=response.headers.get('Link') is None)
                      if 300 <= response.status < 400:
                          locations = response.headers.get_all('Location', [])
                          result['redirect_location_count'] = len(locations)
                          if len(locations) == 1 and len(locations[0]) <= 8192:
                              target = urllib.parse.urlsplit(locations[0])
                              host = target.hostname or ''
                              result['redirect_https'] = target.scheme == 'https'
                              # Never log a signed URL, userinfo, path or query, or follow it.
                              if re.fullmatch(r'[A-Za-z0-9.-]{1,253}', host):
                                  result['redirect_host'] = host
                      if response.status == 200 and len(body) <= 1048576:
                          result['sha256'] = hashlib.sha256(body).hexdigest()
                          if name == 'package_inventory':
                              items = json.loads(body)
                              engine = [item for item in items
                                  if (item.get('repository') or {}).get('id') == 1310736214]
                              result['visible_engine_packages'] = len(engine)
                              result['engine_package_visibility'] = {
                                  visibility: sum(item.get('visibility') == visibility for item in engine)
                                  for visibility in ('public', 'private', 'internal')}
              except Exception as error:
                  result['error_class'] = type(error).__name__
              print('KIRA_PUBLICATION_ACCESS ' + json.dumps(result, sort_keys=True))
          PY

      - name: Check out only the selected readback helpers without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: access-check
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/publication_policy.py
            /.github/scripts/remote_maven_readback.py

      - name: Verify an actual known Maven POM with the selected production reader
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          python3 -B -E -s - <<'PY'
          import json, os, pathlib, sys, xml.etree.ElementTree as ET
          token, actor = os.environ.pop('GH_TOKEN'), os.environ.pop('GH_ACTOR')
          helpers = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'access-check/.github/scripts'
          sys.path.insert(0, str(helpers))
          try:
              import remote_maven_readback as reader
              budget = reader._Budget()
              budget.requests = 2
              facts, body = reader._read(
                  'me/manga/kira/source/source-engine/0.1.0/source-engine-0.1.0.pom',
                  (actor, token), 1048576, budget, capture=True)
              if b'<!DOCTYPE' in body or b'<!ENTITY' in body:
                  raise ValueError('POM entity declaration refused')
              pom = ET.fromstring(body.decode('utf-8'))
              ns = '{http://maven.apache.org/POM/4.0.0}'
              if pom.tag != ns + 'project' or [pom.findtext(ns + key) for key in
                      ('groupId', 'artifactId', 'version')] != ['me.manga.kira.source', 'source-engine', '0.1.0']:
                  raise ValueError('Known POM identity differs')
              print('KIRA_MAVEN_READER ' + json.dumps({'result': 'PASS', 'read_only': True,
                  'version': '0.1.0', 'size': facts['size'], 'sha256': facts['sha256'],
                  'requests': 2 - budget.requests}, sort_keys=True))
          except Exception as error:
              print('KIRA_MAVEN_READER ' + json.dumps({'result': 'FAIL', 'error_class': type(error).__name__}))
              raise SystemExit(1) from None
          PY

      - name: Remove only this diagnostic's disposable helper checkout
        if: ${{ always() }}
        shell: bash
        run: |
          python3 -B -E -s - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'access-check'
          if root.is_symlink():
              raise SystemExit('Redirected diagnostic cleanup refused')
          if root.exists():
              shutil.rmtree(root)
          PY

  preflight:
    if: >-
      ${{ !inputs.access_check && github.event_name == 'workflow_dispatch' && github.repository == 'kira-manga/kira-source-engine' &&
          github.repository_id == '1310736214' && github.ref == 'refs/heads/remediation/production-readiness-2026-09-04' &&
          github.repository_owner == 'kira-manga' && github.run_attempt == 1 &&
          github.workflow_ref == format('kira-manga/kira-source-engine/.github/workflows/publish.yml@{0}', github.ref) &&
          github.workflow_sha == github.sha }}
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: control
    outputs:
      environment: ${{ steps.intake.outputs.environment }}
      environment_id: ${{ steps.intake.outputs.environment_id }}
      record_sha256: ${{ steps.intake.outputs.record_sha256 }}
      record_artifact_id: ${{ steps.record.outputs.artifact-id }}
    steps:
      - name: Check out trusted control source, never producer code as the caller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false

      - name: Require independently selected policy and prepare this exact publisher invocation
        id: runtime
        env:
          KIRA_PUBLISHER_REQUEST: ${{ inputs.selection }}
          KIRA_PUBLICATION_API_READ_TOKEN: ${{ secrets.KIRA_PUBLICATION_API_READ_TOKEN }}
        run: /usr/bin/python3 -B -E -s .github/scripts/publisher_workflow.py prepare-preflight

      - name: Check out the exact producer bytes with complete lineage
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.runtime.outputs.producer_sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false

      - name: Download only the selected immutable producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kira-manga/kira-source-engine
          run-id: ${{ steps.runtime.outputs.producer_run_id }}
          artifact-ids: ${{ steps.runtime.outputs.producer_artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.runtime.outputs.root }}/artifact
          merge-multiple: true

      - name: Acquire only the pinned public Darwin native verifier distribution
        timeout-minutes: 2
        env:
          PRIVATE_ROOT: ${{ steps.runtime.outputs.root }}
        run: |
          set -euo pipefail
          umask 077
          asset="$PRIVATE_ROOT/gh_2.100.0_macOS_arm64.zip"
          [[ ! -e "$asset" && ! -L "$asset" ]]
          /usr/bin/curl --disable --fail --silent --show-error --location --max-redirs 2 \
            --noproxy '*' --proxy '' --proto '=https' --proto-redir '=https' \
            --max-time 60 --max-filesize 67108864 --output "$asset" \
            https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_macOS_arm64.zip
          # Existing native_verify authenticates these exact bytes before extracting/executing.

      - name: Real fresh native intake and live publisher preflight
        id: intake
        timeout-minutes: 10
        env:
          KIRA_SELECTION_SHA256: ${{ steps.runtime.outputs.selection_sha256 }}
          KIRA_PUBLICATION_API_READ_TOKEN: ${{ secrets.KIRA_PUBLICATION_API_READ_TOKEN }}
        run: /usr/bin/python3 -B -E -s .github/scripts/publisher_workflow.py preflight

      - name: Retain the bounded exact comparison for this run, not an approval receipt
        id: record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kira-publisher-preflight-${{ github.run_id }}-1
          path: ${{ steps.runtime.outputs.root }}/comparison.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 1

      - name: Always remove only this preflight's owned inputs
        if: ${{ always() }}
        run: /usr/bin/python3 -B -E -s .github/scripts/publisher_workflow.py cleanup-preflight

  protected-recheck:
    needs: preflight
    if: >-
      ${{ needs.preflight.result == 'success' && needs.preflight.outputs.environment != '' &&
          needs.preflight.outputs.environment_id != '' && needs.preflight.outputs.record_sha256 != '' &&
          needs.preflight.outputs.record_artifact_id != '' }}
    # Only successful preflight against the trusted control policy may produce this name.
    # Never use inputs.selection or API-discovered defaults as an environment selector.
    # The owner permits initiator approval; required named review and no admin bypass remain.
    environment:
      name: ${{ needs.preflight.outputs.environment }}
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: control
    steps:
      - name: Check out the same trusted control source in a new job
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false

      - name: Prepare fresh post-boundary inputs without accepting an approval Boolean
        id: runtime
        env:
          KIRA_PUBLISHER_REQUEST: ${{ inputs.selection }}
          KIRA_PUBLICATION_API_READ_TOKEN: ${{ secrets.KIRA_PUBLICATION_API_READ_TOKEN }}
        run: /usr/bin/python3 -B -E -s .github/scripts/publisher_workflow.py prepare-recheck

      - name: Check out the same producer without generated roots or restored caches
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.runtime.outputs.producer_sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false

      - name: Reacquire the original selected producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kira-manga/kira-source-engine
          run-id: ${{ steps.runtime.outputs.producer_run_id }}
          artifact-ids: ${{ steps.runtime.outputs.producer_artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.runtime.outputs.root }}/artifact
          merge-multiple: true

      - name: Retrieve only this invocation's pinned comparison artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kira-manga/kira-source-engine
          run-id: ${{ github.run_id }}
          artifact-ids: ${{ needs.preflight.outputs.record_artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.runtime.outputs.root }}/handoff
          merge-multiple: true

      - name: Reacquire the same pinned public Darwin verifier, never a PATH binary
        timeout-minutes: 2
        env:
          PRIVATE_ROOT: ${{ steps.runtime.outputs.root }}
        run: |
          set -euo pipefail
          umask 077
          asset="$PRIVATE_ROOT/gh_2.100.0_macOS_arm64.zip"
          [[ ! -e "$asset" && ! -L "$asset" ]]
          /usr/bin/curl --disable --fail --silent --show-error --location --max-redirs 2 \
            --noproxy '*' --proxy '' --proto '=https' --proto-redir '=https' \
            --max-time 60 --max-filesize 67108864 --output "$asset" \
            https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_macOS_arm64.zip

      - name: Real fresh recheck, exact raw staging, then refuse missing writer authority
        timeout-minutes: 10
        env:
          KIRA_SELECTION_SHA256: ${{ steps.runtime.outputs.selection_sha256 }}
          KIRA_RECORD_SHA256: ${{ needs.preflight.outputs.record_sha256 }}
          KIRA_PUBLICATION_API_READ_TOKEN: ${{ secrets.KIRA_PUBLICATION_API_READ_TOKEN }}
        run: /usr/bin/python3 -B -E -s .github/scripts/publisher_workflow.py recheck

      - name: Retain bounded held-command diagnostics, not an executed native graph
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kira-publisher-held-${{ github.run_id }}-1
          path: ${{ steps.runtime.outputs.root }}/diagnostics/*.json
          if-no-files-found: ignore
          overwrite: false
          retention-days: 1

      - name: Always remove only owned intake and staged producer input
        if: ${{ always() }}
        run: /usr/bin/python3 -B -E -s .github/scripts/publisher_workflow.py cleanup-recheck

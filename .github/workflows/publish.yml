name: Package publication disabled (Engine6 containment)

on:
  workflow_dispatch:

permissions: {}

jobs:
  refuse-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Refuse remote package publication
        shell: bash
        run: |
          printf '%s\n' '::error::Remote package publication is disabled by Engine6 current-source containment.'
          printf '%s\n' 'No checkout, build or upload is performed. See README.md for the open release gates.'
          exit 1

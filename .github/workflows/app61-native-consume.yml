name: App61 NONSHIPPING strict native consumption

on:
  push:
    branches: [validation/app61-native-consume-20260915-01]
    paths: [.github/workflows/app61-native-consume.yml, 'ci/app61/**']

permissions:
  contents: read
  packages: read

concurrency:
  group: kira-app61-native-consume
  cancel-in-progress: false

jobs:
  consume:
    if: github.repository == 'kira-manga/kira-source-engine' && github.event_name == 'push' && github.ref == 'refs/heads/validation/app61-native-consume-20260915-01' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out this reviewed carrier only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Select the scaffold's exact launcher runtime
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
          check-latest: false
      - name: Use the pinned Ruby for actual input verification
        uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c
        with:
          ruby-version: '3.3.12'
          bundler: none
      - name: Strict unsigned bundle consumption and configuration checksum-negative; no release or tests
        id: consume
        timeout-minutes: 50
        env:
          # The launcher reads/forwards these ONLY for the positive strict unsigned bundle.
          # No ambient GITHUB_TOKEN or owner-token fallback reaches child processes.
          KIRA_PACKAGES_USER: ${{ github.actor }}
          KIRA_PACKAGES_READ_TOKEN: ${{ github.token }}
        run: python3 control/ci/app61/consume.py --consume-nonshipping
      - name: Bounded input/bundle/checksum evidence only, including partial failures
        if: ${{ always() && steps.consume.outputs.cleanup_barrier_absent == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app61-consume-${{ github.run_id }}
          path: |
            reports/binding.json
            reports/bundle.json
            reports/checksum-negative.log
            reports/final-stop.log
            reports/git-checkout.log
            reports/git-fetch.log
            reports/git-init.log
            reports/java.log
            reports/negative-artifact.json
            reports/negative-proof.json
            reports/negative-stop.log
            reports/positive-stop.log
            reports/result.json
            reports/ruby-runtime.log
            reports/source-after.json
            reports/source-before.json
            reports/strict-bundle.log
            reports/verify-source-inputs.log
          if-no-files-found: error
          retention-days: 3

name: Exact owned source cohort consumers (check only)

on:
  push:
    branches: [remediation/priority-sources-20261017]
    paths:
      - .github/workflows/source-cohort-consumer-check.yml
      - .github/scripts/source_cohort_consumer.py
      - .github/scripts/backend-source-cohort.init.gradle
      - .github/scripts/test_source_cohort_consumer.py
  workflow_dispatch:
    inputs:
      selection:
        description: Exact independently selected successful promotion tuple (optional; committed selection is the default)
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: kira-exact-owned-source-consumers
  cancel-in-progress: false

env:
  # Genuine completed 0.2.7 promotion39370741913, selected only after successful readback.
  # Producer677 tests plus5Darwin IPC cases are not replayed; no packages token is needed.
  SELECTED_PROMOTION: >-
    {"artifact_id":12241715531,"artifact_name":"kira-owned-file-promotion-39370741913-1","artifact_sha256":"8502546fae732d62c18f78e1a3f69731120f939d8d84990634d05ee23a7d1719","artifact_size":2127710,"job_id":118457824862,"owned_maven":{"file":"owned-maven.tar","files":420,"sha256":"dfe1732c037441dcd55ee8a70374bb6fb7d1f0ec99b5ed9e546735efcd631ec0","size":2600960},"producer":{"archive_sha256":"cb5cc6d6ee772bbea280a80eb31c51f22103fa1cc7317d705a8026a706691255","artifact_id":12240952607,"attestation_job_id":118455831362,"inventory_sha256":"5d248ed6f91ec453abf76ec4ed58db33cb5ce5f55c59f0eee4562cb825074f66","producer_job_id":118450690110,"ref":"refs/heads/remediation/production-readiness-2026-09-04","repository":"kira-manga/kira-source-engine","run_attempt":1,"run_id":39368491643,"seal_sha256":"e5fb342a571c4901184d27c69f6b5e045e7e7b4591d0d55c5b00b62d1dcf190f","source_sha":"871e28c1898c90d749d4dae3b26637bd13fe1741","source_tree":"34b23ed815cae121321021f6a91904c36578881d","transport_sha256":"57b4193bc0592cfd309bc8c7b9ce79469fd38d14dae73cedddcdedcadd63aba8","version":"0.2.7","workflow_id":319431577,"workflow_ref":"kira-manga/kira-source-engine/.github/workflows/ci.yml@refs/heads/remediation/production-readiness-2026-09-04","workflow_sha":"871e28c1898c90d749d4dae3b26637bd13fe1741","workflow_sha256":"d048e77145b7b3c29343462eeea46d4649750f718b53195f9845e22bb9c4b579"},"ref":"refs/heads/remediation/priority-sources-20261017","repository":"kira-manga/kira-source-engine","repository_id":1310736214,"run_attempt":1,"run_id":39370741913,"source_sha":"4c1007bf7c6fb683b2b73b159980e4389e5e9e63","workflow_id":387605345,"workflow_path":".github/workflows/owned-file-promotion-check.yml"}

# Check-only followups may select one affected platform via the pushed commit message.
# [consumer apple] / [consumer linux] / [consumer backend]; absent or ambiguous tags run both platforms.
# Backend-only omits the unchanged App checkout/batch and Apple job; omitted checks are not PASS.
jobs:
  linux:
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (!contains(github.event.head_commit.message, '[consumer apple]') || contains(github.event.head_commit.message, '[consumer linux]') || contains(github.event.head_commit.message, '[consumer backend]')) &&
          github.repository == 'kira-manga/kira-source-engine' && github.repository_owner == 'kira-manga' &&
          github.repository_id == '1310736214' && github.run_attempt == 1 &&
          github.ref == 'refs/heads/remediation/priority-sources-20261017' &&
          github.workflow_ref == 'kira-manga/kira-source-engine/.github/workflows/source-cohort-consumer-check.yml@refs/heads/remediation/priority-sources-20261017' &&
          github.workflow_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
        working-directory: control
    steps:
      - name: Exact reviewed Engine control
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Reserve fresh owned consumer locations
        id: runtime
        env:
          KIRA_PROMOTION_SELECTION: ${{ inputs.selection || env.SELECTED_PROMOTION }}
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py prepare
      - name: Exact public App source candidate
        if: ${{ steps.runtime.outputs.backend_only != 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/kira-app
          ref: 84881a3b3f24d62f1671cb29c04d79cf9598a484
          path: app
          persist-credentials: false
      - name: Exact public Backend source candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/Kira-backend
          ref: 9ead6a5eb6de1ac4608dd83001540b6d5b787151
          path: backend
          persist-credentials: false
      - name: Download Engine's own immutable selected promotion artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kira-manga/kira-source-engine
          run-id: ${{ steps.runtime.outputs.run_id }}
          artifact-ids: ${{ steps.runtime.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.runtime.outputs.root }}/artifact
          merge-multiple: true
      - name: Fresh successful-promotion receipt and complete original byte intake
        timeout-minutes: 3
        env:
          KIRA_INTAKE_READ_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py intake
      - name: Supported Java21 consumer toolchain
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: App JVM contracts and Android compile plus native transport tests; capture stop dispose
        if: ${{ steps.runtime.outputs.backend_only != 'true' }}
        id: app_batch
        timeout-minutes: 36
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py app
      - name: Backend exact selected unit and real PostgreSQL batch; capture stop dispose
        if: ${{ !cancelled() && ((steps.runtime.outputs.backend_only == 'true' && success()) || steps.app_batch.outcome == 'success' || steps.app_batch.outcome == 'failure') }}
        timeout-minutes: 18
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py backend
      - name: Always verify owned worker shutdown before evidence/disposal
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        timeout-minutes: 8
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py finalize
      - name: Retain bounded Linux consumer source byte and test evidence
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kira-source-consumer-linux-${{ github.run_id }}-1
          path: ${{ steps.runtime.outputs.root }}/diagnostics/
          if-no-files-found: error
          overwrite: false
          retention-days: 3
      - name: Dispose only this job's verified owned roots
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        timeout-minutes: 2
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py dispose

  apple:
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          ((!contains(github.event.head_commit.message, '[consumer linux]') && !contains(github.event.head_commit.message, '[consumer backend]')) ||
           contains(github.event.head_commit.message, '[consumer apple]') ||
           (contains(github.event.head_commit.message, '[consumer linux]') && contains(github.event.head_commit.message, '[consumer backend]'))) &&
          github.repository == 'kira-manga/kira-source-engine' && github.repository_owner == 'kira-manga' &&
          github.repository_id == '1310736214' && github.run_attempt == 1 &&
          github.ref == 'refs/heads/remediation/priority-sources-20261017' &&
          github.workflow_ref == 'kira-manga/kira-source-engine/.github/workflows/source-cohort-consumer-check.yml@refs/heads/remediation/priority-sources-20261017' &&
          github.workflow_sha == github.sha }}
    runs-on: macos-latest
    timeout-minutes: 92
    defaults:
      run:
        shell: bash
        working-directory: control
    steps:
      - name: Exact reviewed Engine control
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Reserve fresh owned consumer locations
        id: runtime
        env:
          KIRA_PROMOTION_SELECTION: ${{ inputs.selection || env.SELECTED_PROMOTION }}
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py prepare
      - name: Exact public App source candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/kira-app
          ref: 84881a3b3f24d62f1671cb29c04d79cf9598a484
          path: app
          persist-credentials: false
      - name: Download Engine's own immutable selected promotion artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kira-manga/kira-source-engine
          run-id: ${{ steps.runtime.outputs.run_id }}
          artifact-ids: ${{ steps.runtime.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.runtime.outputs.root }}/artifact
          merge-multiple: true
      - name: Fresh successful-promotion receipt and complete original byte intake
        timeout-minutes: 3
        env:
          KIRA_INTAKE_READ_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py intake
      - name: Supported Java21 consumer toolchain
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: App authenticated Kotlin2.4 libffi bootstrap using actual Engine owner context
        timeout-minutes: 15
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py bootstrap
      - name: App device and simulator compile plus Darwin tests against the exact selected cohort
        timeout-minutes: 65
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py app
      - name: Always verify owned shutdown and remove only owned bootstrap
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        timeout-minutes: 8
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py finalize
      - name: Retain bounded Apple consumer source binary and bootstrap evidence
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kira-source-consumer-apple-${{ github.run_id }}-1
          path: ${{ steps.runtime.outputs.root }}/diagnostics/
          if-no-files-found: error
          overwrite: false
          retention-days: 3
      - name: Dispose only this job's verified owned roots
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        timeout-minutes: 2
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py dispose

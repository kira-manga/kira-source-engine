name: Exact owned source cohort consumers (check only)

on:
  push:
    branches: [remediation/priority-sources-20261017]
    paths:
      - .github/workflows/source-cohort-consumer-check.yml
      - .github/scripts/source_cohort_consumer.py
      - .github/scripts/backend-source-cohort.init.gradle
      - .github/scripts/test_source_cohort_consumer.py
  workflow_dispatch:
    inputs:
      selection:
        description: Exact independently selected successful promotion tuple (optional; committed selection is the default)
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: kira-exact-owned-source-consumers
  cancel-in-progress: false

env:
  # Genuine completed promotion39051133291, independently selected after success.
  # Original producer671 executions are not replayed; no packages token is needed.
  SELECTED_PROMOTION: >-
    {"artifact_id":12106899203,"artifact_name":"kira-owned-file-promotion-39051133291-1","artifact_sha256":"215bf9d4aa0c0db59fe2c781a30301f3d6861e77d74dca2430e973026c4f0307","artifact_size":2126103,"job_id":117449774086,"owned_maven":{"file":"owned-maven.tar","files":420,"sha256":"0f5077fb530f1863997c71dd6d19cf7ba63bba35bc27608329d1a1fd9be53482","size":2600960},"producer":{"archive_sha256":"9a81ab0ed2befed10ea7c716fdd03d5d8346b74c171fd49df9b7128abff3439b","artifact_id":12107171679,"attestation_job_id":117446096346,"inventory_sha256":"628cd0381c9ca9f738cc589f42629d812408f54742da4099af134bbb3f59becf","producer_job_id":117442236053,"ref":"refs/heads/remediation/production-readiness-2026-09-04","repository":"kira-manga/kira-source-engine","run_attempt":1,"run_id":39048582890,"seal_sha256":"4355de0cd6691c6d0fce0ac15c991bab58ad93a0df092eb4a5ecc9e4b9e896e1","source_sha":"901bae34291f5baf8dcf104223b27d1d5cd1d15e","source_tree":"9f9869fa47de0a82e001be5de04bbb9d61c662ad","transport_sha256":"8b4e882930deb520a8fecdf85a3793974d735d8a2e1b1b235195806c6db9065e","version":"0.2.0","workflow_id":319431577,"workflow_ref":"kira-manga/kira-source-engine/.github/workflows/ci.yml@refs/heads/remediation/production-readiness-2026-09-04","workflow_sha":"901bae34291f5baf8dcf104223b27d1d5cd1d15e","workflow_sha256":"ca05d0e76818a5788cf83c0666ddd0efcf22c6b09653867e7d0d976883c1f0df"},"ref":"refs/heads/remediation/priority-sources-20261017","repository":"kira-manga/kira-source-engine","repository_id":1310736214,"run_attempt":1,"run_id":39051133291,"source_sha":"25c5b0e8c9faaf8e1b040c88cea740c87af8cefb","workflow_id":387605345,"workflow_path":".github/workflows/owned-file-promotion-check.yml"}

jobs:
  linux:
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.repository == 'kira-manga/kira-source-engine' && github.repository_owner == 'kira-manga' &&
          github.repository_id == '1310736214' && github.run_attempt == 1 &&
          github.ref == 'refs/heads/remediation/priority-sources-20261017' &&
          github.workflow_ref == 'kira-manga/kira-source-engine/.github/workflows/source-cohort-consumer-check.yml@refs/heads/remediation/priority-sources-20261017' &&
          github.workflow_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
        working-directory: control
    steps:
      - name: Exact reviewed Engine control
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Reserve fresh owned consumer locations
        id: runtime
        env:
          KIRA_PROMOTION_SELECTION: ${{ inputs.selection || env.SELECTED_PROMOTION }}
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py prepare
      - name: Exact public App source candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/kira-app
          ref: 2cab935029f94111fface30d0d52527f2c517648
          path: app
          persist-credentials: false
      - name: Exact public Backend source candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/Kira-backend
          ref: 97a7b72d02c1116f79702adc1c605d4cff093d15
          path: backend
          persist-credentials: false
      - name: Download Engine's own immutable selected promotion artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kira-manga/kira-source-engine
          run-id: ${{ steps.runtime.outputs.run_id }}
          artifact-ids: ${{ steps.runtime.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.runtime.outputs.root }}/artifact
          merge-multiple: true
      - name: Fresh successful-promotion receipt and complete original byte intake
        timeout-minutes: 3
        env:
          KIRA_INTAKE_READ_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py intake
      - name: Supported Java21 consumer toolchain
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: App JVM contracts and Android compile plus native transport tests; capture stop dispose
        id: app_batch
        timeout-minutes: 36
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py app
      - name: Backend selected unit and real PostgreSQL parity-preview batch; capture stop dispose
        if: ${{ !cancelled() && (steps.app_batch.outcome == 'success' || steps.app_batch.outcome == 'failure') }}
        timeout-minutes: 18
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py backend
      - name: Always verify owned worker shutdown before evidence/disposal
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        timeout-minutes: 8
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py finalize
      - name: Retain bounded Linux consumer source byte and test evidence
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kira-source-consumer-linux-${{ github.run_id }}-1
          path: ${{ steps.runtime.outputs.root }}/diagnostics/
          if-no-files-found: error
          overwrite: false
          retention-days: 3
      - name: Dispose only this job's verified owned roots
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        timeout-minutes: 2
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py dispose

  apple:
    if: >-
      ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.repository == 'kira-manga/kira-source-engine' && github.repository_owner == 'kira-manga' &&
          github.repository_id == '1310736214' && github.run_attempt == 1 &&
          github.ref == 'refs/heads/remediation/priority-sources-20261017' &&
          github.workflow_ref == 'kira-manga/kira-source-engine/.github/workflows/source-cohort-consumer-check.yml@refs/heads/remediation/priority-sources-20261017' &&
          github.workflow_sha == github.sha }}
    runs-on: macos-latest
    timeout-minutes: 92
    defaults:
      run:
        shell: bash
        working-directory: control
    steps:
      - name: Exact reviewed Engine control
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Reserve fresh owned consumer locations
        id: runtime
        env:
          KIRA_PROMOTION_SELECTION: ${{ inputs.selection || env.SELECTED_PROMOTION }}
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py prepare
      - name: Exact public App source candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: kira-manga/kira-app
          ref: 2cab935029f94111fface30d0d52527f2c517648
          path: app
          persist-credentials: false
      - name: Download Engine's own immutable selected promotion artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: kira-manga/kira-source-engine
          run-id: ${{ steps.runtime.outputs.run_id }}
          artifact-ids: ${{ steps.runtime.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.runtime.outputs.root }}/artifact
          merge-multiple: true
      - name: Fresh successful-promotion receipt and complete original byte intake
        timeout-minutes: 3
        env:
          KIRA_INTAKE_READ_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py intake
      - name: Supported Java21 consumer toolchain
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: App authenticated Kotlin2.4 libffi bootstrap using actual Engine owner context
        timeout-minutes: 15
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py bootstrap
      - name: App device and simulator compile plus Darwin tests against the exact selected cohort
        timeout-minutes: 65
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py app
      - name: Always verify owned shutdown and remove only owned bootstrap
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        timeout-minutes: 8
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py finalize
      - name: Retain bounded Apple consumer source binary and bootstrap evidence
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kira-source-consumer-apple-${{ github.run_id }}-1
          path: ${{ steps.runtime.outputs.root }}/diagnostics/
          if-no-files-found: error
          overwrite: false
          retention-days: 3
      - name: Dispose only this job's verified owned roots
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        timeout-minutes: 2
        run: /usr/bin/python3 -B -E -s .github/scripts/source_cohort_consumer.py dispose

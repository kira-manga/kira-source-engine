name: Shared source engine CI

on:
  pull_request:
    branches:
      - remediation/production-readiness-2026-09-04
  push:
    branches:
      - remediation/production-readiness-2026-09-04

permissions:
  contents: read

concurrency:
  group: source-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # Same hosted label as the qualified source-bootstrap check; admission below
    # requires actual Darwin/ARM64, never an Intel fallback or SDK alias/install.
    runs-on: macos-latest
    # Preserve existing phase bounds plus headroom for the owned cold simulator.
    timeout-minutes: 65
    outputs:
      candidate: ${{ steps.eligibility.outputs.candidate }}
      version: ${{ steps.eligibility.outputs.version }}
      source_tree: ${{ steps.eligibility.outputs.source_tree }}
      workflow_sha256: ${{ steps.eligibility.outputs.workflow_sha256 }}
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      inventory_sha256: ${{ steps.pack.outputs.inventory_sha256 }}
      seal_sha256: ${{ steps.pack.outputs.seal_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      transport_sha256: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare fresh owned runtime (no cache or output restore)
        id: runtime
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, platform, re
          os.umask(0o077)
          assert platform.system() == 'Darwin' and platform.machine() == 'arm64'
          assert os.environ['RUNNER_OS'] == 'macOS' and os.environ['RUNNER_ARCH'] == 'ARM64'
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['GITHUB_RUN_ID'])
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['GITHUB_RUN_ATTEMPT'])
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert temp.is_dir() and re.fullmatch(r'/[A-Za-z0-9._/-]+', str(temp))
          root = temp / ('kira-ci-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          root.mkdir(mode=0o700)
          # Record exclusive creation before any later preparation can fail.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('root=' + str(root) + '\n')
          owner = dict(repository=os.environ['GITHUB_REPOSITORY'], run_id=os.environ['GITHUB_RUN_ID'],
                       run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], source_sha=os.environ['GITHUB_SHA'], root=str(root))
          with (root / 'owner.json').open('x') as f:
              json.dump(owner, f, sort_keys=True)
          for name in ('gradle', 'tmp', 'diagnostics'):
              (root / name).mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'KIRA_CI_ROOT={root}\nGRADLE_USER_HOME={root}/gradle\nTMPDIR={root}/tmp\n')
          # No KONAN_DATA_DIR/native.home/GRADLE_OPTS before strict preflight.
          PY

      - name: Set up Java
        id: java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Admit fresh committed source and the exact owned source-bootstrap inputs
        id: bootstrap_admission
        run: python3 -B .github/scripts/publication_policy.py ci-bootstrap

      - name: Test bounded policy comparisons (not provenance)
        timeout-minutes: 2
        env:
          TMPDIR: ${{ env.KIRA_CI_ROOT }}/tmp
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_publication_policy.py' -v

      - name: Require existing SDK37 metadata and android.jar (37 or 37.0 layout)
        run: python3 -B .github/scripts/publication_policy.py sdk37

      - name: Prepare authenticated source-built libffi and private Kotlin 2.2.21
        id: bootstrap
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          printf 'started=true\n' >> "$GITHUB_OUTPUT"
          python3 -B scripts/release/prepare-libffi-source.py prepare \
            2>&1 | tee "$KIRA_CI_ROOT/diagnostics/bootstrap.log"

      - name: Verify the private native profile and bind candidate eligibility
        id: eligibility
        run: python3 -B .github/scripts/publication_policy.py ci-start --state "$KIRA_CI_ROOT/before.json"

      - name: Create one owned simulator from an already installed iOS runtime
        id: simulator
        timeout-minutes: 9
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['KIRA_CI_ROOT'])
          owner = dict(repository=os.environ['GITHUB_REPOSITORY'], run_id=os.environ['GITHUB_RUN_ID'],
                       run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], source_sha=os.environ['GITHUB_SHA'], root=str(root))
          assert not root.is_symlink() and json.loads((root / 'owner.json').read_text()) == owner
          devices = json.loads(subprocess.check_output(['/usr/bin/xcrun', 'simctl', 'list', 'devices', '--json'], timeout=30))['devices']
          choices = [(runtime, device) for runtime, group in devices.items()
                     if re.fullmatch(r'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+', runtime)
                     for device in group if device.get('isAvailable') and device.get('deviceTypeIdentifier', '').startswith('com.apple.CoreSimulator.SimDeviceType.iPhone-')]
          assert choices, 'No installed available iOS/iPhone simulator; no runtime download or target substitution'
          runtime, device = max(choices, key=lambda pair: tuple(map(int, pair[0].split('.iOS-')[1].split('-'))))
          name = 'kira-ci-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          assert all(d['name'] != name for group in devices.values() for d in group), 'Owned simulator name already exists'
          reservation = {'name': name, 'runtime': runtime, 'device_type': device['deviceTypeIdentifier']}
          # Reserve before create; a partial create still has an exact cleanup identity.
          with (root / 'simulator.json').open('x') as f:
              json.dump(reservation, f)
          udid = subprocess.check_output(['/usr/bin/xcrun', 'simctl', 'create', name, reservation['device_type'], runtime], text=True, timeout=30).strip()
          assert re.fullmatch(r'[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}', udid), 'Unexpected simulator identifier'
          reservation['udid'] = udid
          # Preserve the name/runtime/type reservation if UUID recording is interrupted.
          pending = root / 'simulator-created.json'
          with pending.open('x') as f:
              json.dump(reservation, f)
          pending.replace(root / 'simulator.json')
          (root / 'diagnostics/simulator.json').write_text(json.dumps(reservation, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('KIRA_CI_SIMULATOR=' + udid + '\n')
          subprocess.run(['/usr/bin/xcrun', 'simctl', 'boot', udid], check=True, timeout=30)
          subprocess.run(['/usr/bin/xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True, timeout=420)
          PY

      # One producer workspace/invocation. No Maven-local, mode or version override here.
      - name: Check all targets and, only if eligible, produce all native descriptors
        id: build
        timeout-minutes: 20
        shell: bash
        env:
          ELIGIBLE: ${{ steps.eligibility.outputs.candidate }}
        run: |
          set -euo pipefail
          roots=(check)
          # These are also reached by check; task-scoped options select one owned
          # ready device, not a second test invocation or a reduced test filter.
          for module in source-contract source-engine source-testkit; do
            roots+=(":${module}:iosSimulatorArm64Test" --device "$KIRA_CI_SIMULATOR")
          done
          if [[ "$ELIGIBLE" == true ]]; then
            for module in source-contract source-engine source-testkit; do
              for generator in generatePomFileFor generateMetadataFileFor; do
                for publication in KotlinMultiplatform Android Jvm IosArm64 IosSimulatorArm64; do
                  roots+=(":${module}:${generator}${publication}Publication")
                done
              done
            done
          fi
          ./gradlew --no-daemon --no-parallel --max-workers=1 --console=plain \
            --no-build-cache --no-configuration-cache \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process "${roots[@]}" \
            2>&1 | tee "$KIRA_CI_ROOT/diagnostics/production.log"

      - name: Stop only this job's owned Gradle workers after production
        if: ${{ always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          # Match the pinned wrapper distribution, never bootstrap it just to stop.
          [[ ! -L "$GRADLE_USER_HOME" ]] || { echo '::error::Refusing redirected Gradle home'; exit 1; }
          for gradle in "$GRADLE_USER_HOME"/wrapper/dists/gradle-9.6.1-bin/*/gradle-9.6.1/bin/gradle; do
            [[ -f "$gradle" && -x "$gradle" && ! -L "$gradle" ]] || continue
            "$gradle" --offline --no-daemon --stop 2>&1 | tee "$KIRA_CI_ROOT/diagnostics/stop-production.log"
            exit 0
          done
          [[ ! -d "$GRADLE_USER_HOME/daemon" ]] || { echo '::error::Owned daemon registry has no installed Gradle launcher'; exit 1; }
          echo 'No installed owned Gradle runtime; no stop/bootstrap needed.'

      - name: Release the owned simulator immediately after production
        id: simulator_disposal
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' 2>&1 | tee "$KIRA_CI_ROOT/diagnostics/simulator-disposal.log"
          import json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['KIRA_CI_ROOT'])
          assert root == pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True) / ('kira-ci-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          owner = dict(repository=os.environ['GITHUB_REPOSITORY'], run_id=os.environ['GITHUB_RUN_ID'],
                       run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], source_sha=os.environ['GITHUB_SHA'], root=str(root))
          assert not root.is_symlink() and json.loads((root / 'owner.json').read_text()) == owner
          reservation = json.loads((root / 'simulator.json').read_text())
          udid = os.environ['KIRA_CI_SIMULATOR']
          assert reservation['name'] == root.name and reservation['udid'] == udid
          assert re.fullmatch(r'[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}', udid)
          failed = False
          for command in ('shutdown', 'delete'):
              try:
                  subprocess.run(['/usr/bin/xcrun', 'simctl', command, udid], check=True, timeout=30)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  print('Owned simulator ' + command + ' failed; remaining cleanup is still attempted.')
                  failed = True
          if failed:
              raise SystemExit(1)
          print('Owned simulator shutdown/delete completed; final reservation cleanup verifies absence.')
          PY

      - name: Compare committed inputs at the phase boundary
        run: python3 -B .github/scripts/publication_policy.py ci-check --state "$KIRA_CI_ROOT/before.json"

      # Same inputs/outputs, offline export. Descriptor execution is allowed in EXPORT;
      # this is not the separate no-regeneration promotion and does not rerun check.
      - name: Export existing candidate production bytes offline
        id: export
        timeout-minutes: 5
        if: ${{ steps.eligibility.outputs.candidate == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --offline --no-daemon --no-parallel --max-workers=1 --console=plain \
            --no-build-cache --no-configuration-cache \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PkiraPublicationMode=export :exportKiraPublicationBytes \
            2>&1 | tee "$KIRA_CI_ROOT/diagnostics/export.log"

      - name: Stop only this job's owned Gradle workers after export
        if: ${{ always() && (steps.export.outcome == 'success' || steps.export.outcome == 'failure') }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          [[ ! -L "$GRADLE_USER_HOME" ]] || { echo '::error::Refusing redirected Gradle home'; exit 1; }
          for gradle in "$GRADLE_USER_HOME"/wrapper/dists/gradle-9.6.1-bin/*/gradle-9.6.1/bin/gradle; do
            [[ -f "$gradle" && -x "$gradle" && ! -L "$gradle" ]] || continue
            "$gradle" --offline --no-daemon --stop 2>&1 | tee "$KIRA_CI_ROOT/diagnostics/stop-export.log"
            exit 0
          done
          [[ ! -d "$GRADLE_USER_HOME/daemon" ]] || { echo '::error::Owned daemon registry has no installed Gradle launcher'; exit 1; }
          echo 'No installed owned Gradle runtime; no stop/bootstrap needed.'

      - name: Compare committed inputs and verify native isolation even after failed production
        if: ${{ always() && steps.eligibility.outcome == 'success' }}
        run: python3 -B .github/scripts/publication_policy.py ci-check --state "$KIRA_CI_ROOT/before.json"

      - name: Validate complete sealed bundle and archive it once
        id: pack
        if: ${{ steps.eligibility.outputs.candidate == 'true' }}
        run: >-
          python3 -B .github/scripts/publication_policy.py pack
          --state "$KIRA_CI_ROOT/before.json"
          --output "$KIRA_CI_ROOT/kira-publication-bytes.tar"

      - name: Upload the exact archive (never overwrite)
        id: upload
        if: ${{ steps.eligibility.outputs.candidate == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kira-publication-bytes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KIRA_CI_ROOT }}/kira-publication-bytes.tar
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 3

      - name: Retain action output receipt outside the sealed archive
        if: ${{ steps.eligibility.outputs.candidate == 'true' }}
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          TRANSPORT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
          ARCHIVE_SHA256: ${{ steps.pack.outputs.archive_sha256 }}
          INVENTORY_SHA256: ${{ steps.pack.outputs.inventory_sha256 }}
          SEAL_SHA256: ${{ steps.pack.outputs.seal_sha256 }}
          SOURCE_TREE: ${{ steps.eligibility.outputs.source_tree }}
          WORKFLOW_SHA256: ${{ steps.eligibility.outputs.workflow_sha256 }}
          COMMITTED_VERSION: ${{ steps.eligibility.outputs.version }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, '.github/scripts')
          from publication_policy import hex_value, require
          require(os.environ['ARTIFACT_ID'].isdigit() and int(os.environ['ARTIFACT_ID']) > 0, 'Missing immutable artifact ID')
          keys = ('TRANSPORT_SHA256', 'ARCHIVE_SHA256', 'INVENTORY_SHA256', 'SEAL_SHA256', 'WORKFLOW_SHA256')
          require(all(hex_value(os.environ[k]) for k in keys), 'Missing distinct digest output')
          receipt = {k.lower(): os.environ[k] for k in (*keys, 'ARTIFACT_ID', 'SOURCE_TREE')}
          receipt.update(source_sha=os.environ['GITHUB_SHA'], workflow_ref=os.environ['GITHUB_WORKFLOW_REF'],
                         workflow_sha=os.environ['GITHUB_WORKFLOW_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                         run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], repository=os.environ['GITHUB_REPOSITORY'],
                         version=os.environ['COMMITTED_VERSION'], scope='candidate-transport-not-completed-receipt')
          text = json.dumps(receipt, sort_keys=True, indent=2)
          with (pathlib.Path(os.environ['KIRA_CI_ROOT']) / 'upload-receipt.json').open('x') as f:
              f.write(text + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Candidate transport receipt — not release approval\n```json\n' + text + '\n```\n')
          PY

      - name: Always stop owned workers and preserve diagnostics before cleanup
        id: diagnostics
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        timeout-minutes: 5
        shell: bash
        env:
          OWNED_ROOT: ${{ steps.runtime.outputs.root }}
          JAVA_OUTCOME: ${{ steps.java.outcome }}
          BOOTSTRAP_STARTED: ${{ steps.bootstrap.outputs.started }}
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          ADMISSION_OUTCOME: ${{ steps.eligibility.outcome }}
          SIMULATOR_OUTCOME: ${{ steps.simulator.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          root="$OWNED_ROOT"
          temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          [[ "$root" == "$temp/kira-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" && -d "$root" && ! -L "$root" ]]
          [[ ! -L "$root/diagnostics" ]]
          mkdir -p "$root/diagnostics"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          printf 'java=%s\nbootstrap=%s\nadmission=%s\nsimulator=%s\nbuild=%s\nexport=%s\narchive_upload=%s\n' \
            "$JAVA_OUTCOME" "$BOOTSTRAP_OUTCOME" "$ADMISSION_OUTCOME" "$SIMULATOR_OUTCOME" "$BUILD_OUTCOME" "$EXPORT_OUTCOME" "$UPLOAD_OUTCOME" \
            > "$root/diagnostics/phase-outcomes.txt"
          status=0
          stop_owned_gradle() {
            [[ ! -L "$root/gradle" ]] || { echo '::error::Refusing redirected Gradle home'; return 1; }
            for gradle in "$root"/gradle/wrapper/dists/gradle-9.6.1-bin/*/gradle-9.6.1/bin/gradle; do
              [[ -f "$gradle" && -x "$gradle" && ! -L "$gradle" ]] || continue
              GRADLE_USER_HOME="$root/gradle" python3 -B - "$gradle" <<'PY'
          import subprocess, sys
          subprocess.run([sys.argv[1], '--offline', '--no-daemon', '--stop'], check=True, timeout=60)
          PY
              return
            done
            [[ ! -d "$root/gradle/daemon" ]] || { echo '::error::Owned daemon registry has no installed Gradle launcher'; return 1; }
            echo 'No installed owned Gradle runtime; no stop/bootstrap needed.'
          }
          if [[ "$JAVA_OUTCOME" == success ]]; then
            if ! stop_owned_gradle 2>&1 | tee "$root/diagnostics/final-stop.log"; then status=1; fi
          else
            echo 'Java setup did not complete; no Gradle invocation attempted.' | tee "$root/diagnostics/final-stop.log"
          fi
          # Dispose the helper's own marked tree before diagnostic upload, including
          # failed/cancelled prepare or production. Never delete a preflight-rejected
          # pre-existing tree, and never execute a changed helper during cleanup.
          if [[ "$BOOTSTRAP_STARTED" == true && "$status" == 0 ]]; then
            if ! python3 -B - <<'PY' 2>&1 | tee "$root/diagnostics/bootstrap-cleanup.log"
          import hashlib, json, os, pathlib, stat, subprocess, sys
          repo = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          temp = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          script = repo / 'scripts/release/prepare-libffi-source.py'
          assert not any(p.is_symlink() for p in (script, *script.parents))
          assert hashlib.sha256(script.read_bytes()).hexdigest() == '644e5b089610ab56e1dd0cc7ec41e69c874f5fee07caa39789b75172ab597e12'
          subprocess.run([sys.executable, '-B', str(script), 'cleanup'], check=True, timeout=120)
          owned = temp / 'kira-libffi-source'
          assert not owned.exists() and not owned.is_symlink()
          receipt = temp / 'kira-libffi-provenance.json'
          if receipt.exists() or receipt.is_symlink():
              info = receipt.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 131072
              data = receipt.read_bytes()
              value = json.loads(data)
              assert value['owner'] == dict(schema_version=1, root=str(owned), repository=os.environ['GITHUB_REPOSITORY'],
                                            run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'])
              assert value['cleanup'] == 'complete'
              target = pathlib.Path(os.environ['OWNED_ROOT']) / 'diagnostics/libffi-provenance.json'
              with target.open('xb') as f:
                  f.write(data)
              assert target.read_bytes() == data
              receipt.unlink()  # Exact owned small receipt now retained in diagnostics.
          print('Owned source-bootstrap tree absent; available source provenance preserved.')
          PY
            then status=1; fi
          elif [[ "$BOOTSTRAP_STARTED" == true ]]; then
            echo '::error::Bootstrap cleanup deferred: owned Gradle shutdown failed; not reported clean.'
          fi
          # Resolve only this run's reserved device, including interruption between
          # create and UUID recording. A failure does not skip the evidence paths below.
          if ! python3 -B - <<'PY' 2>&1 | tee "$root/diagnostics/simulator-cleanup.log"
          import json, os, pathlib, re, stat, subprocess
          root = pathlib.Path(os.environ['OWNED_ROOT'])
          owner = dict(repository=os.environ['GITHUB_REPOSITORY'], run_id=os.environ['GITHUB_RUN_ID'],
                       run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], source_sha=os.environ['GITHUB_SHA'], root=str(root))
          assert not root.is_symlink() and json.loads((root / 'owner.json').read_text()) == owner
          reservation_file = root / 'simulator.json'
          if reservation_file.exists() or reservation_file.is_symlink():
              info = reservation_file.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 4096
              reservation = json.loads(reservation_file.read_bytes())
              assert set(reservation) in ({'name', 'runtime', 'device_type'}, {'name', 'runtime', 'device_type', 'udid'})
              assert reservation['name'] == root.name
              assert re.fullmatch(r'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+', reservation['runtime'])
              assert reservation['device_type'].startswith('com.apple.CoreSimulator.SimDeviceType.iPhone-')
              (root / 'diagnostics/simulator.json').write_text(json.dumps(reservation, indent=2) + '\n')
              devices = json.loads(subprocess.check_output(['/usr/bin/xcrun', 'simctl', 'list', 'devices', '--json'], timeout=30))['devices']
              matches = [d for d in devices.get(reservation['runtime'], []) if d['name'] == reservation['name']]
              assert len(matches) <= 1, 'Ambiguous owned simulator identity'
              shutdown_failed = False
              for device in matches:
                  assert device['deviceTypeIdentifier'] == reservation['device_type']
                  assert 'udid' not in reservation or device['udid'] == reservation['udid']
                  if device['state'] != 'Shutdown':
                      try:
                          subprocess.run(['/usr/bin/xcrun', 'simctl', 'shutdown', device['udid']], check=True, timeout=30)
                      except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                          shutdown_failed = True  # Still attempt exact owned deletion; preserve failure.
                  subprocess.run(['/usr/bin/xcrun', 'simctl', 'delete', device['udid']], check=True, timeout=30)
              remaining = json.loads(subprocess.check_output(['/usr/bin/xcrun', 'simctl', 'list', 'devices', '--json'], timeout=30))['devices']
              assert all(d['name'] != reservation['name'] for group in remaining.values() for d in group), 'Owned simulator remains'
              assert not shutdown_failed, 'Owned simulator shutdown failed; later deletion was verified'
          print('No simulator was reserved, or the exact owned simulator is absent after cleanup.')
          PY
          then status=1; fi
          for receipt in before.json upload-receipt.json; do
            if [[ -f "$root/$receipt" && ! -L "$root/$receipt" ]]; then
              if ! cp "$root/$receipt" "$root/diagnostics/$receipt"; then status=1; fi
            fi
          done
          # Preserve the original bytes if the candidate upload failed; this diagnostic
          # artifact is NOT a substitute candidate artifact ID or provenance subject.
          if [[ -L "$root/kira-publication-bytes.tar" ]]; then
            echo '::error::Refusing redirected archive diagnostics'; status=1
          elif [[ "$UPLOAD_OUTCOME" != success && -f "$root/kira-publication-bytes.tar" ]]; then
            if ! cp "$root/kira-publication-bytes.tar" "$root/diagnostics/"; then status=1; fi
          fi
          if [[ "$ADMISSION_OUTCOME" == success ]]; then
            for module in root source-contract source-engine source-testkit; do
              parent="$GITHUB_WORKSPACE"
              if [[ "$module" != root ]]; then parent="$parent/$module"; fi
              if [[ ! -d "$parent" || -L "$parent" || -L "$parent/build" ]]; then
                echo "::error::Refusing unowned report parent: $parent"; status=1; continue
              fi
              for kind in reports test-results; do
                if [[ -L "$parent/build/$kind" ]]; then
                  echo "::error::Refusing redirected report root: $parent/build/$kind"; status=1
                elif [[ -d "$parent/build/$kind" ]]; then
                  # tar does not dereference links or gather unrelated build/cache files.
                  if ! tar -cf "$root/diagnostics/$module-$kind.tar" -C "$parent/build" "$kind"; then status=1; fi
                fi
              done
            done
          fi
          exit "$status"

      - name: Upload diagnostics and receipts even after a failed phase
        id: diagnostics_upload
        if: ${{ always() && steps.diagnostics.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kira-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.runtime.outputs.root }}/diagnostics
          if-no-files-found: error
          overwrite: false
          retention-days: 3

      - name: Always clean only this job's admitted outputs and owned runtime
        if: ${{ always() && steps.runtime.outputs.root != '' }}
        timeout-minutes: 3
        shell: bash
        env:
          OWNED_ROOT: ${{ steps.runtime.outputs.root }}
          ADMISSION_OUTCOME: ${{ steps.eligibility.outcome }}
          PRESERVE_OUTCOME: ${{ steps.diagnostics.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.diagnostics_upload.outcome }}
        run: |
          set -euo pipefail
          root="$OWNED_ROOT"
          temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          [[ "$root" == "$temp/kira-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" && ! -L "$root" ]]
          note() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [[ "$PRESERVE_OUTCOME" != success ]]; then
            note '::error::Cleanup deferred: owned stop/evidence capture failed; remaining outputs/runtime retained, not reported clean.'
            exit 1
          fi
          status=0
          if [[ "$ADMISSION_OUTCOME" == success ]]; then
            # Exact GENERATED roots admitted absent by ci-start; never Gradle clean,
            # global caches, source/configuration or unadmitted pre-existing outputs.
            for relative in .gradle .kotlin build source-contract/build source-engine/build source-testkit/build; do
              parent="$GITHUB_WORKSPACE"
              if [[ "$relative" == */* ]]; then parent="$parent/${relative%/*}"; fi
              if [[ ! -d "$GITHUB_WORKSPACE" || -L "$GITHUB_WORKSPACE" || ! -d "$parent" || -L "$parent" ]]; then
                note "::error::Refusing unowned cleanup parent: $parent"; status=1; continue
              fi
              target="$GITHUB_WORKSPACE/$relative"
              if rm -rf -- "$target" && [[ ! -e "$target" && ! -L "$target" ]]; then
                note "Owned generated root absent after cleanup: $relative"
              else
                note "::error::Owned generated root cleanup failed: $relative"; status=1
              fi
            done
          else
            note 'Generated-root cleanup skipped: fresh source admission did not succeed; no ownership assumed.'
          fi
          if [[ "$EVIDENCE_OUTCOME" != success ]]; then
            # Do not retain multi-GiB homes just because artifact upload failed.
            # Keep bounded captured evidence/receipts, never claim full cleanup.
            for name in gradle tmp; do
              [[ ! -L "$root/$name" ]] || { note '::error::Redirected owned runtime child'; exit 1; }
              rm -rf -- "$root/$name"
              [[ ! -e "$root/$name" && ! -L "$root/$name" ]]
            done
            note '::error::Diagnostic upload failed: owned homes removed; captured evidence retained locally, not reported uploaded or fully clean.'
            exit 1
          fi
          if rm -rf -- "$root" && [[ ! -e "$root" && ! -L "$root" ]]; then
            note 'Owned Gradle/tmp, captured archive/receipts and runtime root absent after cleanup; helper disposal was separately verified.'
          else
            note '::error::Owned runtime cleanup failed.'; status=1
          fi
          exit "$status"

  attest:
    name: attest
    needs: verify
    if: >-
      ${{ needs.verify.result == 'success' && needs.verify.outputs.candidate == 'true' &&
          github.event_name == 'push' && github.repository == 'kira-manga/kira-source-engine' &&
          github.ref == 'refs/heads/remediation/production-readiness-2026-09-04' &&
          github.workflow_ref == 'kira-manga/kira-source-engine/.github/workflows/ci.yml@refs/heads/remediation/production-readiness-2026-09-04' &&
          github.workflow_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Provenance privileges only. No packages:write, remote Maven destination, PAT or publisher.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
      EXPECTED_SOURCE_TREE: ${{ needs.verify.outputs.source_tree }}
      EXPECTED_WORKFLOW_SHA256: ${{ needs.verify.outputs.workflow_sha256 }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
      EXPECTED_INVENTORY_SHA256: ${{ needs.verify.outputs.inventory_sha256 }}
      EXPECTED_SEAL_SHA256: ${{ needs.verify.outputs.seal_sha256 }}
    steps:
      - name: Check out the exact producer source for read-only intake
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare owned intake outside checkout
        id: intake_runtime
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kira-attest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$root"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          printf 'KIRA_ATTEST_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Download only the immutable artifact ID from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          repository: kira-manga/kira-source-engine
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.KIRA_ATTEST_ROOT }}
          merge-multiple: true

      - name: Recheck raw archive, seal and inventory before attesting
        id: intake
        run: >-
          python3 -B .github/scripts/publication_policy.py intake
          --archive "$KIRA_ATTEST_ROOT/kira-publication-bytes.tar"
          --inventory "$KIRA_ATTEST_ROOT/inventory.tsv"

      # Unsupported private-repository capability fails here; no unsigned/PAT fallback.
      # Final success/run-attempt/native verification intake is a LATER read-only operation.
      - name: Attest exactly the archive and original inventory bytes
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ env.KIRA_ATTEST_ROOT }}/kira-publication-bytes.tar
            ${{ env.KIRA_ATTEST_ROOT }}/inventory.tsv
          push-to-registry: false
          show-summary: true

      - name: Always clean this job's owned intake (original artifact retained)
        if: ${{ always() && steps.intake_runtime.outputs.root != '' }}
        shell: bash
        env:
          OWNED_INTAKE_ROOT: ${{ steps.intake_runtime.outputs.root }}
          INTAKE_OUTCOME: ${{ steps.intake.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
        run: |
          set -euo pipefail
          root="$OWNED_INTAKE_ROOT"
          [[ "$root" == "$RUNNER_TEMP/kira-attest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" && ! -L "$root" ]]
          printf 'Attestation intake=%s; provenance=%s. Original archive/inventory remain in the immutable producer artifact; action logs/summary retain diagnostics.\n' \
            "$INTAKE_OUTCOME" "$PROVENANCE_OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"
          if rm -rf -- "$root" && [[ ! -e "$root" && ! -L "$root" ]]; then
            echo 'Owned attestation intake absent after cleanup.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Owned attestation intake cleanup failed.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
